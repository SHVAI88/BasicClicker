<!DOCTYPE html>
<html>
<head>
    <title>Clicker Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="ClickButton">
        <h1>Clicker Game</h1>
        <button id="myButton">Click me!</button>
        <p><span id="score">0</span></p>
    </div>
<div id="clickShop">
        <h2>Shop</h2>
        <button id="upgradeButton"><img src="images/plus.png" alt="plus" width="10%" height="10%"></button>
        <p>cost: <span id="upgradeCost">10</span></p>
        <p>current upgrade: <span id="currupgr">0</span></p>
        <button id="permanentIncomeButton">permanent income</button>
        <p>cost: <span id="permCost">500</span></p>
        <button id="resetButton">reset</button>
    </div>
    <script src="button.js"></script>
</body>
</html>
